kind = "web"
previewPath = "/"
title = "Mwangaza Wire"
description = "Mwangaza News Brief is a public, hourly-updated news reader with real publisher stories and images from Kenya and the world."
version = "1.0.0"
id = "artifacts/tuko-news"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21515

[services.development]
run = "pnpm --filter @workspace/tuko-news run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/tuko-news", "run", "build" ]
serve = "static"
publicDir = "artifacts/tuko-news/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21515"
BASE_PATH = "/"
